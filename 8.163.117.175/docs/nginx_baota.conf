# 例外：游戏登录会通过 HTTP 自调用 /fqxy/sql/yxCurl.php，必须放行（精确匹配优先于正则）
location = /fqxy/sql/yxCurl.php { include enable-php-56.conf; }  # 升级后改成 enable-php-83.conf
location = /fq/sql/yxCurl.php { include enable-php-56.conf; }  # 若游戏目录改名为 fq
# 宝塔 → 网站 → 设置 → 配置文件（或"伪静态"）中加入，放在 location ~ \.php$ 之前
location ~* \.(ini|bak|orig|txt|sql|log|md|bat|conf|MYD|MYI|frm|opt)$ { deny all; }
location ~* (^|/)(ache|acher|ip|config|sql|xxsql|ppp|class|ini|data|tools|lib|sql_schema|xxjy)/ { deny all; }
location = /access_log { deny all; }
autoindex off;
